
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reserve a table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container my-4">
    <div class="card ticket">
        <h4 class="head">Reserve a table</h4>

        <div class="card-body">
            <form>
                <div class="mb-3">
                    <label for="name">Your name</label>
                    <input class="form-control" type="text" id="name"
                           name="name" required>
                </div>

                <div class="mb-3">
                    <label for="email">Email</label>
                    <input class="form-control" type="email" id="email"
                           name="email" required>
                </div>

                <div class="mb-3">
                    <label for="phone">Phone</label>
                    <input class="form-control" type="tel" id="phone"
                           name="phone" required>
                </div>

                <div class="mb-3">
                    <label for="guests">Guests</label>
                    <input class="form-control" type="number" id="guests"
                           name="guests" min="1" max="20" required>
                </div>

                <div class="mb-3">
                    <label for="date">Date</label>
                    <input class="form-control" type="date" id="date"
                           name="date" required>
                </div>

                <p>Seating</p>

                <div class="mb-3">
                    <input type="radio" id="inside" name="seating"
                           value="inside" required>
                    <label for="inside">Inside</label>

                    <input type="radio" id="terrace" name="seating"
                           value="terrace">
                    <label for="terrace">Terrace</label>
                </div>

                <div class="mb-3">
                    <label for="meal">Meal</label>
                    <select class="form-select" id="meal" name="meal" required>
                        <option value="">Choose...</option>
                        <option value="lunch">Lunch</option>
                        <option value="dinner">Dinner</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="comments">Comments</label>
                    <textarea class="form-control" id="comments"
                              name="comments"></textarea>
                </div>

                <div class="mb-3">
                    <input type="checkbox" id="agree" name="agree" required>
                    <label for="agree">I agree to the terms</label>
                </div>

                <button class="btn find" type="submit">Reserve</button>
                <button class="btn clear" type="reset">Clear</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
