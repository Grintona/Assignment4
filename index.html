<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book a train ticket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container my-4">
    <div class="card ticket">
        <h1 class="head">Book a train ticket</h1>

        <div class="card-body">
            <form>
                <!-- One way / Round trip: two radio inputs shown as a segmented button group -->
                <div class="trip mb-4" role="group" aria-label="Trip type">
                    <input type="radio" class="btn-check" name="trip" id="one" value="one-way" checked>
                    <label class="btn trip-btn" for="one">One way</label>

                    <input type="radio" class="btn-check" name="trip" id="round" value="round-trip">
                    <label class="btn trip-btn" for="round">Round trip</label>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <div class="form-floating">
                            <input class="form-control" id="from" name="from" type="text"
                                   placeholder="Astana" autocomplete="off" required>
                            <label for="from">From</label>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <div class="form-floating">
                            <input class="form-control" id="to" name="to" type="text"
                                   placeholder="Almaty" autocomplete="off" required>
                            <label for="to">To</label>
                        </div>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label" for="dep">Departure</label>
                        <input class="form-control" id="dep" name="departure" type="date" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label" for="ret">Return</label>
                        <input class="form-control" id="ret" name="return" type="date">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label" for="people">Passengers</label>
                        <select class="form-select" id="people" name="passengers">
                            <option value="1" selected>1 adult</option>
                            <option value="2">2 adults</option>
                            <option value="3">3 adults</option>
                            <option value="4">4 adults</option>
                            <option value="5">5 adults</option>
                            <option value="6">6 adults</option>
                        </select>
                    </div>
                </div>

                <fieldset class="mb-3">
                    <legend class="form-label">Carriage class</legend>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="class" id="seat" value="seat" required>
                        <label class="form-check-label" for="seat">Seat</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="class" id="coupe" value="coupe" checked>
                        <label class="form-check-label" for="coupe">Coupé</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="class" id="sleep" value="sleeper">
                        <label class="form-check-label" for="sleep">Sleeper</label>
                    </div>
                </fieldset>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="phone">Phone</label>
                        <div class="input-group">
                            <span class="input-group-text prefix" id="phone-prefix">+7</span>
                            <input class="form-control" id="phone" name="phone" type="tel"
                                   placeholder="701 234 56 78" autocomplete="tel-national"
                                   aria-describedby="phone-prefix" required>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" id="email" name="email" type="email"
                               placeholder="name@example.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms" value="yes">
                    <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
                    <label class="form-check-label" for="agree">I agree with the carriage rules</label>
                </div>

                <!-- HTML order: Clear, then Find trains. On a phone the order is reversed with CSS -->
                <div class="buttons">
                    <button class="btn clear" type="reset">Clear</button>
                    <button class="btn find" type="submit">Find trains</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
